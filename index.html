<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador e Verificador de KML Avançado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --bg-color: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --ring: rgba(59, 130, 246, 0.3);
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
        }

        .container {
            background: var(--surface);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            color: var(--text-main);
            margin: 0 0 1.5rem 0;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Indicadores visuais para os títulos */
        .section-create h2::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--primary);
            border-radius: 50%;
        }

        .section-verify h2::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: var(--success);
            border-radius: 50%;
        }

        .section {
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: var(--surface);
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        input[type="file"] {
            padding: 0.6rem;
            background-color: var(--bg-color);
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background-color: var(--border);
            color: var(--text-main);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            margin-right: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #cbd5e1;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--ring);
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-verify {
            background-color: var(--success);
        }

        .btn-verify:hover {
            background-color: var(--success-hover);
        }

        .divider {
            height: 1px;
            background-color: var(--border);
            margin: 2rem 0;
            border-radius: 1px;
        }

        /* Responsividade para telas muito pequenas */
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            h2 {
                font-size: 1.15rem;
            }
            input[type="text"], input[type="file"], button {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="section section-create">
        <h2>Criar KML</h2>
        
        <div class="input-group">
            <label for="coords">Coordenadas (Lat, Long)</label>
            <input type="text" id="coords" placeholder="Ex: -6.314559, -39.439166">
        </div>

        <div class="input-group">
            <label for="locname">Nome do Local (Opcional)</label>
            <input type="text" id="locname" placeholder="Ex: Ponto de Inspeção">
        </div>

        <button onclick="generateKML()">
            <svg xmlns="http://www.w3.org/2005/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Gerar e Baixar KML
        </button>
    </div>

    <div class="divider"></div>

    <div class="section section-verify" style="margin-bottom: 0;">
        <h2>Verificar KML</h2>
        
        <div class="input-group">
            <label for="kmlFile">Selecione um arquivo .kml</label>
            <input type="file" id="kmlFile" accept=".kml">
        </div>

        <button class="btn-verify" onclick="verifyKML()">
            <svg xmlns="http://www.w3.org/2005/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
            Verificar no Google Maps
        </button>
    </div>
</div>

<script>
    function generateKML() {
        const input = document.getElementById('coords').value.trim();
        let locName = document.getElementById('locname').value.trim();
        
        if (!input) {
            alert("Por favor, insira as coordenadas.");
            return;
        }

        const parts = input.split(',');
        
        if (parts.length !== 2) {
            alert("Por favor, insira as coordenadas no formato correto: latitude, longitude");
            return;
        }

        const lat = parseFloat(parts[0].trim());
        const lng = parseFloat(parts[1].trim());

        if (!locName) {
            locName = `${lat}, ${lng}`;
        }

        const kmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2" xmlns:gx="http://www.google.com/kml/ext/2.2" xmlns:kml="http://www.opengis.net/kml/2.2" xmlns:atom="http://www.w3.org/2005/Atom">
<Document id="document">
	<name>Mapa sem título</name>
	<gx:CascadingStyle kml:id="__managed_style_0B55FC6ED03F289EA294_highlight">
		<Style>
			<IconStyle>
				<scale>1.2</scale>
				<Icon>
					<href>https://earth.google.com/earth/document/icon?color=1976d2&amp;id=2000&amp;scale=4</href>
				</Icon>
				<hotSpot x="64" y="128" xunits="pixels" yunits="insetPixels"/>
			</IconStyle>
			<LabelStyle>
			</LabelStyle>
			<LineStyle>
				<color>ff2dc0fb</color>
				<width>6</width>
			</LineStyle>
			<PolyStyle>
				<color>40ffffff</color>
			</PolyStyle>
			<BalloonStyle>
				<displayMode>hide</displayMode>
			</BalloonStyle>
		</Style>
	</gx:CascadingStyle>
	<gx:CascadingStyle kml:id="__managed_style_0B55FC6ED03F289EA294_normal">
		<Style>
			<IconStyle>
				<Icon>
					<href>https://earth.google.com/earth/document/icon?color=1976d2&amp;id=2000&amp;scale=4</href>
				</Icon>
				<hotSpot x="64" y="128" xunits="pixels" yunits="insetPixels"/>
			</IconStyle>
			<LabelStyle>
			</LabelStyle>
			<LineStyle>
				<color>ff2dc0fb</color>
				<width>4</width>
			</LineStyle>
			<PolyStyle>
				<color>40ffffff</color>
			</PolyStyle>
			<BalloonStyle>
				<displayMode>hide</displayMode>
			</BalloonStyle>
		</Style>
	</gx:CascadingStyle>
	<StyleMap id="__managed_style_0B55FC6ED03F289EA294">
		<Pair>
			<key>normal</key>
			<styleUrl>#__managed_style_0B55FC6ED03F289EA294_normal</styleUrl>
		</Pair>
		<Pair>
			<key>highlight</key>
			<styleUrl>#__managed_style_0B55FC6ED03F289EA294_highlight</styleUrl>
		</Pair>
	</StyleMap>
	<Placemark id="Placemark_gerado_via_script">
		<name>${locName}</name>
		<LookAt>
			<longitude>${lng}</longitude>
			<latitude>${lat}</latitude>
			<altitude>0</altitude>
			<heading>0</heading>
			<tilt>0</tilt>
			<gx:fovy>35</gx:fovy>
			<range>1049.36853995487</range>
			<altitudeMode>relativeToGround</altitudeMode>
		</LookAt>
		<styleUrl>#__managed_style_0B55FC6ED03F289EA294</styleUrl>
		<Point>
			<extrude>1</extrude>
			<coordinates>${lng},${lat},0</coordinates>
		</Point>
	</Placemark>
</Document>
</kml>`;

        const blob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        const safeName = locName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
        
        a.href = url;
        a.download = `${safeName || 'coordenadas'}.kml`;
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
    }

    function verifyKML() {
        const fileInput = document.getElementById('kmlFile');
        
        if (fileInput.files.length === 0) {
            alert("Por favor, selecione um arquivo KML para verificar.");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = function(event) {
            const kmlText = event.target.result;
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(kmlText, "text/xml");
            const coordinatesNodes = xmlDoc.getElementsByTagName("coordinates");
            
            if (coordinatesNodes.length === 0) {
                alert("Não foi possível encontrar coordenadas no arquivo KML.");
                return;
            }

            const coordString = coordinatesNodes[0].textContent.trim();
            const coordsParts = coordString.split(',');

            if (coordsParts.length >= 2) {
                const lng = coordsParts[0].trim();
                const lat = coordsParts[1].trim();
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
                window.open(mapsUrl, '_blank');
            } else {
                alert("As coordenadas encontradas no arquivo estão em um formato inválido.");
            }
        };

        reader.onerror = function() {
            alert("Erro ao ler o arquivo selecionado.");
        };

        reader.readAsText(file);
    }
</script>

</body>
</html>
